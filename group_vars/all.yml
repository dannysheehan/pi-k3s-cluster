# ntfy push notifications for alerts. The topic name acts as a shared secret
# on ntfy.sh (anyone who knows it can read/post), so it is stored with
# ansible-vault. Password file: ~/.ansible/vault-pass-pi-cluster (see
# ansible.cfg; keep a backup). To view/change:
#   ansible-vault decrypt/encrypt_string — or: ansible localhost -m debug -a var=ntfy_topic
# healthchecks.io dead-man's switch (best-practices review, finding A3).
# Two checks, created 2026-07-05 via API (key: ~/.ansible/healthchecks-api-key):
#   pi-cluster-heartbeat        — CronJob pings every 5m; silence = cluster down
#   pi-cluster-alerting-watchdog — Alertmanager Watchdog pings ~10m; silence =
#                                  alerting pipeline broken even if cluster is up
# Ping URLs are secrets (anyone with the URL can fake pings) — vaulted.
