# Ansible configuration for pi-cluster
# This file configures Ansible to use project-local collections and roles

[defaults]
# Use only the project-local collections directory (installed via requirements.yml).
# No fallbacks to user-level or system collections: stray installs there cannot
# pollute lookups or trigger compatibility warnings.
collections_path = ./collections

# Use local roles directory if needed in future
roles_path = ./roles

# Default inventory file
inventory = ./hosts.ini

# Ansible Vault password lives OUTSIDE the repo (created 2026-07-05, back it
# up — losing it means re-encrypting all !vault values with a new password).
# Used for inline-encrypted secrets in group_vars/all.yml (e.g. ntfy_topic).
vault_password_file = ~/.ansible/vault-pass-pi-cluster

# Disable host key checking for initial setup (enable in production)
host_key_checking = False

# SSH connection settings
# private_key_file = ~/.ssh/id_rsa

# Increase timeout for Raspberry Pi operations
timeout = 30

# Reduce SSH connection overhead
[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

# Privilege escalation defaults
[privilege_escalation]
become = True
become_method = sudo
become_user = root
#become_ask_pass = True
