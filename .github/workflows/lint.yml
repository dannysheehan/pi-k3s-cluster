name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-invariants:
    name: Rebuild Invariants
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate verification scripts
        run: |
          bash -n scripts/verify-cluster.sh tests/offline/test-rebuild-invariants.sh
          shellcheck scripts/verify-cluster.sh tests/offline/test-rebuild-invariants.sh
          tests/offline/test-rebuild-invariants.sh

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync lint dependencies
        run: uv sync --locked --group dev

      - name: Run yamllint
        run: uv run --no-sync --group dev yamllint -c .yamllint.yml .

  ansible-lint:
    name: Ansible Lint
    needs: yamllint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync lint dependencies
        run: uv sync --locked --group dev

      - name: Install Ansible collections
        run: uv run --no-sync --group dev ansible-galaxy collection install -r requirements.yml -p ./collections

      - name: Run ansible-lint
        env:
          # Avoid workstation vault_password_file from ansible.cfg on public CI
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible.ci.cfg
        run: uv run --no-sync --group dev ansible-lint

  actionlint:
    name: Action Lint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -sfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" \
            | bash -s -- "${ACTIONLINT_VERSION}" "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Run actionlint
        run: actionlint -color

  secrets:
    name: Secret Scan
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
