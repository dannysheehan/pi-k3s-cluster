---
# Add exactly one agent through the API VIP:
# ansible-playbook k3s-add-worker.yml --limit <one-agent>

- name: Add one K3s agent
  hosts: workers
  gather_facts: false
  become: true
  pre_tasks:
    - name: Require an explicit single-host inventory limit
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
        fail_msg: Target exactly one agent with --limit <node>.

    - name: Check API health on control-plane servers
      ansible.builtin.command: kubectl get --raw=/healthz
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ item }}"
      loop: "{{ groups['masters'] }}"
      register: master_health
      changed_when: false
      failed_when: false

    - name: Choose a healthy control-plane server
      ansible.builtin.set_fact:
        healthy_delegate: >-
          {{ (master_health.results
              | selectattr('rc', 'equalto', 0)
              | map(attribute='item') | list | first) | default('') }}

    - name: Require a healthy control-plane server
      ansible.builtin.assert:
        that:
          - healthy_delegate | length > 0
        fail_msg: No healthy control-plane server can coordinate the agent join.

    - name: Read agent join token
      ansible.builtin.command: cat /var/lib/rancher/k3s/server/node-token
      delegate_to: "{{ healthy_delegate }}"
      register: agent_join_token
      changed_when: false
      no_log: true

  tasks:
    - name: Check whether a K3s agent unit exists
      ansible.builtin.command: systemctl list-unit-files k3s-agent.service
      register: k3s_agent_unit
      changed_when: false
      failed_when: false

    - name: Download verified K3s installer
      ansible.builtin.get_url:
        url: "{{ k3s_install_script_url }}"
        dest: /usr/local/src/k3s-install.sh
        checksum: "{{ k3s_install_script_checksum }}"
        owner: root
        group: root
        mode: '0755'

    - name: Check K3s agent state when installed
      ansible.builtin.command: systemctl is-active k3s-agent
      register: k3s_agent_state
      changed_when: false
      failed_when: false
      when: "'k3s-agent.service' in k3s_agent_unit.stdout"

    - name: Refuse automatic recovery of inactive K3s agent state
      ansible.builtin.fail:
        msg: >-
          K3s agent is installed but inactive on {{ inventory_hostname }}.
          Investigate before replacing its local state.
      when:
        - "'k3s-agent.service' in k3s_agent_unit.stdout"
        - k3s_agent_state.rc != 0

    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Render K3s agent configuration
      ansible.builtin.template:
        src: templates/k3s/agent-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: '0600'
      vars:
        k3s_join_token: "{{ agent_join_token.stdout }}"
      no_log: true

    - name: Install K3s agent through the API VIP
      ansible.builtin.command: /usr/local/src/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: agent
      when: "'k3s-agent.service' not in k3s_agent_unit.stdout"

    - name: Wait for K3s agent service
      ansible.builtin.command: systemctl is-active k3s-agent
      register: agent_active
      until: agent_active.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Configure crictl for the K3s runtime
      ansible.builtin.include_tasks: tasks/configure-crictl.yml

    - name: Install host CNI plugins required by the storage-network NAD
      ansible.builtin.include_tasks: tasks/install-storage-cni-plugins.yml

    - name: Wait for agent node registration
      ansible.builtin.command: kubectl get node {{ inventory_hostname }}
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ healthy_delegate }}"
      register: agent_registered
      until: agent_registered.rc == 0
      retries: 30
      delay: 5
      changed_when: false
      # NotReady is expected until Cilium is installed.
