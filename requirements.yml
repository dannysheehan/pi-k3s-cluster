# Ansible collection dependencies for pi-cluster
# Install with: ansible-galaxy collection install -r requirements.yml -p ./collections

---
collections:
  # Required for Helm and Kubernetes resource management
  - name: kubernetes.core
    version: "6.5.0"

  # mount, sysctl, etc. used by host prep
  - name: ansible.posix
    version: "2.2.2"
