---
# Remove exactly one K3s embedded-etcd server. The target must be a canonical
# inventory name, for example:
# ansible-playbook k3s-remove-master.yml --limit pi-ctl-03 --forks=1
#
# K3s's managed-etcd node-removal controller removes the matching etcd peer
# when the Kubernetes Node is deleted. Do not bypass that controller with a
# separate etcdctl member remove.

- name: Remove one K3s control-plane server safely
  hosts: masters
  gather_facts: false
  become: true
  serial: 1
  vars:
    drain_timeout: 300
    force_remove: false
    skip_drain: false
    wipe_data: false
  pre_tasks:
    - name: Require one exact canonical inventory target
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
          - ansible_limit == inventory_hostname
        fail_msg: >-
          Target exactly one server by its canonical inventory name, for
          example --limit pi-ctl-03 --forks=1. Host patterns, groups,
          comma-separated limits, and substring-style targets are not allowed.

    - name: Check API health on each other control-plane server
      ansible.builtin.command: kubectl get --raw=/healthz
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ item }}"
      loop: "{{ groups['masters'] | reject('equalto', inventory_hostname) | list }}"
      register: other_master_health
      changed_when: false
      failed_when: false

    - name: Choose a healthy other control-plane server as delegate
      ansible.builtin.set_fact:
        healthy_delegate: >-
          {{ (other_master_health.results
              | selectattr('rc', 'equalto', 0)
              | map(attribute='item') | list | first) | default('') }}

    - name: Require a healthy other control-plane server
      ansible.builtin.assert:
        that:
          - healthy_delegate | length > 0
        fail_msg: >-
          No healthy control-plane server other than {{ inventory_hostname }}
          is available to coordinate a safe removal.

    - name: Get exact control-plane node readiness from the healthy delegate
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - nodes
          - -l
          - node-role.kubernetes.io/control-plane=true,node-role.kubernetes.io/etcd=true
          - -o
          - >-
            jsonpath={range .items[*]}{.metadata.name}{"\t"}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ healthy_delegate }}"
      register: control_plane_readiness
      changed_when: false

    - name: Count healthy control-plane nodes before removal
      ansible.builtin.set_fact:
        healthy_control_plane_count: >-
          {{ control_plane_readiness.stdout_lines
              | select('search', '\\tTrue$') | list | length }}
        target_control_plane_healthy: >-
          {{ control_plane_readiness.stdout_lines
              | select('match', '^' ~ (inventory_hostname | regex_escape) ~ '\\tTrue$')
              | list | length == 1 }}

    - name: Preserve embedded-etcd quorum before server removal
      ansible.builtin.assert:
        that:
          - healthy_control_plane_count | int >= 3
          - target_control_plane_healthy | bool
        fail_msg: >-
          Refusing to remove {{ inventory_hostname }}. At least three healthy
          control-plane nodes, including the target, are required before
          removal so that two healthy servers remain.

  tasks:
    - name: Check whether the exact server node exists in Kubernetes
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - node
          - "{{ inventory_hostname }}"
          - --ignore-not-found
          - -o
          - name
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ healthy_delegate }}"
      register: kubernetes_node
      changed_when: false

    - name: Set exact Kubernetes node state
      ansible.builtin.set_fact:
        node_in_cluster: "{{ kubernetes_node.stdout == 'node/' ~ inventory_hostname }}"
        kubernetes_node_name: "{{ inventory_hostname }}"

    - name: Check whether the K3s server service is installed
      ansible.builtin.command: systemctl list-unit-files k3s.service
      register: server_service_unit
      changed_when: false
      failed_when: false

    - name: Set K3s server installation state
      ansible.builtin.set_fact:
        server_installed: "{{ 'k3s.service' in server_service_unit.stdout }}"

    - name: Cordon the server before drain
      ansible.builtin.command: kubectl cordon {{ kubernetes_node_name }}
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ healthy_delegate }}"
      when:
        - node_in_cluster | bool
        - not (skip_drain | bool)
      changed_when: true

    - name: Drain server workloads
      ansible.builtin.command:
        argv: "{{ ['kubectl', 'drain', kubernetes_node_name, '--ignore-daemonsets', '--delete-emptydir-data', '--timeout=' ~ (drain_timeout | string) ~ 's'] + (['--force'] if (force_remove | bool) else []) }}"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ healthy_delegate }}"
      when:
        - node_in_cluster | bool
        - not (skip_drain | bool)
      changed_when: true

    - name: Stop and disable K3s server while preserving its state by default
      ansible.builtin.systemd_service:
        name: k3s
        state: stopped
        enabled: false
      when: server_installed | bool

    # Stop first so the removed server cannot race the deletion by
    # re-registering. A healthy remaining server processes K3s's managed-etcd
    # node-removal event and removes the matching peer.
    - name: Delete the exact server node from Kubernetes
      ansible.builtin.command: >-
        kubectl delete node {{ kubernetes_node_name }} --wait=true
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ healthy_delegate }}"
      when: node_in_cluster | bool
      changed_when: true

    - name: Wait for managed-etcd controller to remove the peer
      ansible.builtin.command:
        argv:
          - /var/lib/rancher/k3s/data/current/bin/etcdctl
          - --endpoints=https://127.0.0.1:2379
          - --cacert=/var/lib/rancher/k3s/server/tls/etcd/server-ca.crt
          - --cert=/var/lib/rancher/k3s/server/tls/etcd/server-client.crt
          - --key=/var/lib/rancher/k3s/server/tls/etcd/server-client.key
          - member
          - list
      environment:
        ETCDCTL_API: "3"
      delegate_to: "{{ healthy_delegate }}"
      register: etcd_members_after_removal
      until:
        - etcd_members_after_removal.rc == 0
        - inventory_hostname not in etcd_members_after_removal.stdout
      retries: 18
      delay: 5
      changed_when: false

    - name: Check for the K3s server uninstall script
      ansible.builtin.stat:
        path: /usr/local/bin/k3s-uninstall.sh
      register: server_uninstall_script
      when: wipe_data | bool

    - name: Run the K3s-provided server uninstall script for a requested wipe
      ansible.builtin.command: /usr/local/bin/k3s-uninstall.sh
      when:
        - wipe_data | bool
        - server_uninstall_script.stat.exists

    - name: Remove only explicit K3s server state and uninstall residue
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/rancher/k3s
        - /etc/rancher/k3s
        - /usr/local/bin/k3s
        - /usr/local/bin/k3s-killall.sh
        - /usr/local/bin/k3s-uninstall.sh
        - /etc/systemd/system/k3s.service
        - /etc/systemd/system/k3s.service.env
      when: wipe_data | bool

    - name: Reload systemd after K3s server wipe
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: wipe_data | bool

    - name: Check embedded etcd health after server removal
      ansible.builtin.command: kubectl get --raw=/healthz/etcd
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ healthy_delegate }}"
      changed_when: false

    - name: Report server removal completion
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} has been removed from Kubernetes and the
          remaining embedded-etcd control plane is healthy.
          {{ 'K3s server state was explicitly wiped.' if (wipe_data | bool)
          else 'K3s server state was preserved; the server is stopped and disabled.' }}
