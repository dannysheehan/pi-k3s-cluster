---
# ============================================================================
# Raspberry Pi K3s Cluster - Victoria Metrics Monitoring Stack
# ============================================================================
#
# This playbook installs a lightweight monitoring stack using Victoria Metrics
# instead of kube-prometheus-stack. Victoria Metrics is ideal for Raspberry Pi
# clusters because:
# - No CRDs required (avoids API server stress)
# - 3x less memory usage than Prometheus
# - 100% PromQL compatible (same dashboards work)
# - Better compression (7x less disk space)
#
# Components installed:
# 1. Victoria Metrics Single (time-series database)
# 2. VictoriaLogs Single (log storage backend)
# 3. VMAgent (metrics scraper)
# 4. Fluent Bit (log shipper DaemonSet)
# 5. Grafana (dashboards — metrics via VictoriaMetrics, logs via VictoriaLogs)
# 6. Node Exporter (host metrics)
#
# Prerequisites:
# - K3s cluster with add-ons installed (03-addons.yml completed)
# - Longhorn storage available for persistent volumes
# - Traefik ingress controller running
# - kubeconfig available at ~/.kube/config-rpi
#
# Access after deployment:
# - Grafana: http://192.168.1.200/grafana (admin / admin)
#   Datasources: VictoriaMetrics (default) + VictoriaLogs
# - Victoria Metrics: kubectl port-forward -n monitoring svc/vmsingle-victoria-metrics-single-server 8428:8428
# - VictoriaLogs:     kubectl port-forward -n monitoring svc/vlogs-victoria-logs-single-server 9428:9428
#
# ============================================================================

- name: Install Victoria Metrics + VictoriaLogs Monitoring Stack
  hosts: localhost
  connection: local
  vars:
    kubeconfig: ~/.kube/config-rpi
  tasks:
    # ========================================================================
    # PREREQUISITES CHECK
    # ========================================================================
    - name: Verify Longhorn is available
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: StorageClass
        name: longhorn
      register: longhorn_sc
      failed_when: longhorn_sc.resources | length == 0
      retries: 5
      delay: 10
      until: longhorn_sc.resources | length > 0
      tags: [monitoring, prerequisites]

    - name: Verify Traefik is running
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Deployment
        namespace: traefik
        name: traefik
      register: traefik_deploy
      failed_when: traefik_deploy.resources | length == 0
      retries: 5
      delay: 10
      until: traefik_deploy.resources | length > 0
      tags: [monitoring, prerequisites]

    # ========================================================================
    # NAMESPACE CREATION
    # ========================================================================
    - name: Create monitoring namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: monitoring
            labels:
              name: monitoring
      tags: [monitoring]

    # ========================================================================
    # UPDATE TRAEFIK TO ENABLE PROMETHEUS METRICS
    # ========================================================================
    - name: Update Traefik to enable Prometheus metrics
      kubernetes.core.helm:
        name: traefik
        chart_ref: traefik/traefik
        chart_version: "30.1.0"
        release_namespace: traefik
        kubeconfig: "{{ kubeconfig }}"
        values:
          service:
            type: LoadBalancer
          providers:
            kubernetesIngress:
              enabled: true
              publishedService:
                enabled: true
            kubernetesGateway:
              enabled: true
          gatewayClass:
            enabled: true
            name: traefik
          ingressRoute:
            dashboard:
              enabled: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          logs:
            access:
              enabled: true
          # Prometheus metrics
          metrics:
            prometheus:
              enabled: true
              entryPoint: metrics
              addEntryPointsLabels: true
              addRoutersLabels: true
              addServicesLabels: true
          ports:
            metrics:
              port: "{{ traefik_metrics_port }}"
              expose:
                default: true
              exposedPort: "{{ traefik_metrics_port }}"
              protocol: TCP
      tags: [monitoring, traefik_metrics]

    # ========================================================================
    # HELM REPOSITORIES
    # ========================================================================
    - name: Add Victoria Metrics Helm Repo
      kubernetes.core.helm_repository:
        name: vm
        repo_url: "https://victoriametrics.github.io/helm-charts/"
      tags: [monitoring, repositories, vmsingle, victorialogs, vmagent]

    - name: Add Grafana Helm Repo
      kubernetes.core.helm_repository:
        name: grafana
        repo_url: "https://grafana.github.io/helm-charts"
      tags: [monitoring, repositories, grafana]

    - name: Add Prometheus Community Helm Repo (for node-exporter)
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: "https://prometheus-community.github.io/helm-charts"
      tags: [monitoring, repositories, node_exporter]

    - name: Add Fluent Helm Repo (for fluent-bit)
      kubernetes.core.helm_repository:
        name: fluent
        repo_url: "https://fluent.github.io/helm-charts"
      tags: [monitoring, repositories, fluent-bit]

    # helm_repository adds repo config but does NOT fetch the chart index.
    # helm repo update is required so subsequent helm install/upgrade tasks
    # can resolve chart versions without a "no chart version found" error.
    - name: Update Helm repo indexes
      ansible.builtin.command: helm repo update vm grafana prometheus-community fluent
      changed_when: false
      tags: [monitoring, repositories, vmsingle, victorialogs, vmagent, node_exporter, grafana, fluent-bit]

    # ========================================================================
    # NODE EXPORTER - Host metrics
    # ========================================================================
    - name: Install Node Exporter
      kubernetes.core.helm:
        name: node-exporter
        chart_ref: prometheus-community/prometheus-node-exporter
        chart_version: "{{ node_exporter_chart_version }}"
        release_namespace: monitoring
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        values:
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      tags: [monitoring, node_exporter]

    # Several charts assume nodes answer health checks in ~1s. That is often
    # too optimistic on Pi workers under storage or network pressure, so widen
    # the probe budget before concluding the pod is broken.
    - name: Relax Node Exporter probes for slow nodes
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: patched
        kind: DaemonSet
        namespace: monitoring
        name: node-exporter-prometheus-node-exporter
        definition:
          spec:
            template:
              spec:
                containers:
                  - name: node-exporter
                    readinessProbe:
                      periodSeconds: 15
                      timeoutSeconds: 5
                      failureThreshold: 5
                    livenessProbe:
                      periodSeconds: 15
                      timeoutSeconds: 5
                      failureThreshold: 5
      tags: [monitoring, node_exporter]

    # ========================================================================
    # VICTORIA METRICS SINGLE - Time-series database
    # ========================================================================
    - name: Install Victoria Metrics Single
      kubernetes.core.helm:
        name: vmsingle
        chart_ref: vm/victoria-metrics-single
        chart_version: "{{ victoria_metrics_version }}"
        release_namespace: monitoring
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        timeout: 300s
        values:
          server:
            # Mark storage-backed observability workloads so the scheduler can
            # prefer not to co-locate all of them on one worker. Replica spread
            # in Longhorn does not prevent attached-volume ownership from piling
            # onto the same node.
            podLabels:
              pi-cluster.io/storage-heavy: "true"
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchExpressions:
                          - key: pi-cluster.io/storage-heavy
                            operator: In
                            values:
                              - "true"
                      topologyKey: kubernetes.io/hostname
            retentionPeriod: "{{ vm_retention }}"
            persistentVolume:
              enabled: true
              storageClass: "{{ storage_class }}"
              size: "{{ vm_storage_size }}"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
            # Optimisations for Raspberry Pi
            extraArgs:
              dedup.minScrapeInterval: 30s
              search.maxConcurrentRequests: 2
              search.maxQueueDuration: 30s
      tags: [monitoring, vmsingle]

    # vmsingle is storage-backed and can take longer to become meaningfully
    # ready than stateless web apps. Favor a slower readiness transition over
    # repeated liveness restarts.
    - name: Relax Victoria Metrics probes for storage-backed startup
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: patched
        kind: StatefulSet
        namespace: monitoring
        name: vmsingle-victoria-metrics-single-server
        definition:
          spec:
            template:
              spec:
                containers:
                  - name: vmsingle
                    readinessProbe:
                      initialDelaySeconds: 10
                      periodSeconds: 15
                      timeoutSeconds: 10
                      failureThreshold: 5
                    livenessProbe:
                      initialDelaySeconds: 60
                      periodSeconds: 30
                      timeoutSeconds: 10
                      failureThreshold: 10
      tags: [monitoring, vmsingle]

    # ========================================================================
    # VICTORIALOGS SINGLE - Log storage backend
    # ========================================================================
    - name: Install VictoriaLogs Single
      kubernetes.core.helm:
        name: vlogs
        chart_ref: vm/victoria-logs-single
        chart_version: "{{ victorialogs_chart_version }}"
        release_namespace: monitoring
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        timeout: 300s
        values:
          server:
            # Use the same label/anti-affinity scheme as Grafana and vmsingle
            # so large PVC-backed monitoring components do not all land on the
            # same worker after a rollout or node recovery.
            podLabels:
              pi-cluster.io/storage-heavy: "true"
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchExpressions:
                          - key: pi-cluster.io/storage-heavy
                            operator: In
                            values:
                              - "true"
                      topologyKey: kubernetes.io/hostname
            retentionPeriod: "{{ victorialogs_retention }}"
            persistentVolume:
              enabled: true
              storageClassName: "{{ storage_class }}"
              size: "{{ victorialogs_storage_size }}"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
      tags: [monitoring, victorialogs]

    # VictoriaLogs has the same failure mode as vmsingle on this hardware:
    # mount or replay work can make the pod slow to answer health checks
    # without the process actually being wedged.
    - name: Relax VictoriaLogs probes for storage-backed startup
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: patched
        kind: StatefulSet
        namespace: monitoring
        name: vlogs-victoria-logs-single-server
        definition:
          spec:
            template:
              spec:
                containers:
                  - name: vlogs
                    readinessProbe:
                      initialDelaySeconds: 10
                      periodSeconds: 15
                      timeoutSeconds: 10
                      failureThreshold: 5
                    livenessProbe:
                      initialDelaySeconds: 60
                      periodSeconds: 30
                      timeoutSeconds: 10
                      failureThreshold: 10
      tags: [monitoring, victorialogs]

    # Note: VictoriaLogs Single uses a StatefulSet, not a Deployment
    - name: Wait for VictoriaLogs to be ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: StatefulSet
        namespace: monitoring
        name: vlogs-victoria-logs-single-server
      register: vlogs_sts
      until: >
        vlogs_sts.resources is defined and
        vlogs_sts.resources | length > 0 and
        (vlogs_sts.resources[0].status.readyReplicas | default(0)) ==
        (vlogs_sts.resources[0].status.replicas | default(1))
      retries: 30
      delay: 10
      ignore_errors: true
      tags: [monitoring, victorialogs]

    # ========================================================================
    # VMAGENT - Metrics scraper
    # ========================================================================
    - name: Install VMAgent
      kubernetes.core.helm:
        name: vmagent
        chart_ref: vm/victoria-metrics-agent
        chart_version: "{{ vmagent_chart_version }}"
        release_namespace: monitoring
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        timeout: 300s
        values:
          mode: deployment
          persistentVolume:
            enabled: true
            storageClassName: "{{ storage_class }}"
            size: "{{ vmagent_queue_size }}"
          # Remote write configuration - required by the chart
          remoteWrite:
            - url: "http://vmsingle-victoria-metrics-single-server.monitoring.svc:8428/api/v1/write"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
          extraArgs:
            promscrape.streamParse: "{{ vmagent_stream_parse }}"
            promscrape.discovery.concurrency: "{{ vmagent_discovery_concurrency }}"
            # Persist vmagent's remote-write queue across pod restarts, but
            # cap it so a prolonged outage cannot consume unbounded storage.
            remoteWrite.maxDiskUsagePerURL: "{{ vmagent_queue_max_disk_usage_bytes }}"
          # Scrape configurations
          # Keep these jobs conservative and explicit. On small Pi nodes, broad
          # auto-discovery can create duplicate targets and memory spikes.
          config:
            global:
              scrape_interval: "{{ vmagent_scrape_interval }}"
              scrape_timeout: "{{ vmagent_scrape_timeout }}"
            scrape_configs:
              # Kubernetes API Server
              - job_name: kubernetes-apiservers
                kubernetes_sd_configs:
                  - role: endpoints
                scheme: https
                tls_config:
                  ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  insecure_skip_verify: true
                bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                relabel_configs:
                  - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
                    action: keep
                    regex: default;kubernetes;https

              # Kubelet metrics
              - job_name: kubelet
                kubernetes_sd_configs:
                  - role: node
                scheme: https
                tls_config:
                  ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  insecure_skip_verify: true
                bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                relabel_configs:
                  - action: labelmap
                    regex: __meta_kubernetes_node_label_(.+)
                  - target_label: __address__
                    replacement: kubernetes.default.svc:443
                  - source_labels: [__meta_kubernetes_node_name]
                    target_label: __metrics_path__
                    replacement: /api/v1/nodes/$1/proxy/metrics

              # cAdvisor (container metrics from kubelet)
              - job_name: cadvisor
                kubernetes_sd_configs:
                  - role: node
                scheme: https
                tls_config:
                  ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  insecure_skip_verify: true
                bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                metrics_path: /metrics/cadvisor
                relabel_configs:
                  - action: labelmap
                    regex: __meta_kubernetes_node_label_(.+)
                  - target_label: __address__
                    replacement: kubernetes.default.svc:443
                  - source_labels: [__meta_kubernetes_node_name]
                    target_label: __metrics_path__
                    replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

              # Node Exporter
              - job_name: node-exporter
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                    regex: prometheus-node-exporter
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9100

              # Longhorn
              - job_name: longhorn
                static_configs:
                  - targets:
                      - longhorn-backend.longhorn-system.svc:9500
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: instance
                    replacement: longhorn

              # Traefik
              # Discover Traefik via service endpoints rather than a hardcoded
              # static target so the scrape survives pod reschedules.
              - job_name: traefik
                kubernetes_sd_configs:
                  - role: endpoints
                    namespaces:
                      names:
                        - traefik
                relabel_configs:
                  - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
                    regex: traefik;metrics
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_node_name]
                    target_label: instance
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace

              # Cilium Agent metrics (port 9962)
              # Scrape cilium pods directly to avoid depending on service
              # annotations. Restrict to the named prometheus port, otherwise
              # vmagent may discover multiple pod ports and create duplicates.
              - job_name: cilium-agent
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names:
                        - kube-system
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_k8s_app]
                    regex: cilium
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_container_name]
                    regex: cilium-agent
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_container_port_name]
                    regex: prometheus
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_phase]
                    regex: Running
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9962
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                  - source_labels: [__meta_kubernetes_pod_node_name]
                    target_label: node
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace

              # Hubble metrics (port 9965)
              # Hubble metrics are exposed by the same cilium pods on port 9965.
              # As above, keep the port filter strict to avoid duplicate-target
              # warnings in vmagent logs.
              - job_name: hubble
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names:
                        - kube-system
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_k8s_app]
                    regex: cilium
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_container_name]
                    regex: cilium-agent
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_container_port_name]
                    regex: hubble-metrics
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_phase]
                    regex: Running
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9965
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                  - source_labels: [__meta_kubernetes_pod_node_name]
                    target_label: node
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace

              # Kube State Metrics (if installed)
              - job_name: kube-state-metrics
                kubernetes_sd_configs:
                  - role: service
                relabel_configs:
                  - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
                    regex: kube-state-metrics
                    action: keep

              # Self-monitoring: vmalert rules on the pipeline itself (vmagent
              # queue growth, vmsingle down) need these series to exist.
              - job_name: vmsingle
                static_configs:
                  - targets:
                      - vmsingle-victoria-metrics-single-server.monitoring.svc:8428

              # vmagent has no Service; discover its pod directly.
              - job_name: vmagent
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [monitoring]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
                    regex: vmagent
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_container_port_number]
                    regex: "8429"
                    action: keep
      tags: [monitoring, vmagent]

    # vmagent is lightweight, but on an already busy worker it can still miss
    # short probe deadlines while discovery and remote write queues settle.
    - name: Relax VMAgent probes for loaded nodes
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: patched
        kind: Deployment
        namespace: monitoring
        name: vmagent-victoria-metrics-agent
        definition:
          spec:
            template:
              spec:
                containers:
                  - name: vmagent
                    readinessProbe:
                      initialDelaySeconds: 10
                      periodSeconds: 15
                      timeoutSeconds: 5
                      failureThreshold: 5
                    livenessProbe:
                      initialDelaySeconds: 15
                      periodSeconds: 20
                      timeoutSeconds: 10
                      failureThreshold: 5
      tags: [monitoring, vmagent]

    - name: Wait for VMAgent deployment to be ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Deployment
        namespace: monitoring
        name: vmagent-victoria-metrics-agent
      register: vmagent_deploy
      until: >
        vmagent_deploy.resources is defined and
        vmagent_deploy.resources | length > 0 and
        (vmagent_deploy.resources[0].status.readyReplicas | default(0)) ==
        (vmagent_deploy.resources[0].status.replicas | default(1))
      retries: 30
      delay: 10
      failed_when: false
      tags: [monitoring, vmagent]

    - name: Get VMAgent pods for diagnostics
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Pod
        namespace: monitoring
        label_selectors:
          - app.kubernetes.io/instance=vmagent
      register: vmagent_pods
      when: >
        vmagent_deploy.resources | default([]) | length == 0 or
        (vmagent_deploy.resources[0].status.readyReplicas | default(0)) !=
        (vmagent_deploy.resources[0].status.replicas | default(1))
      tags: [monitoring, vmagent]

    - name: Get VMAgent pods for verification
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Pod
        namespace: monitoring
        label_selectors:
          - app.kubernetes.io/instance=vmagent
      register: vmagent_pods_ready
      changed_when: false
      tags: [monitoring, verification]

    # The smoke test is intentionally lightweight: it proves that series exist
    # in VictoriaMetrics without coupling success to a specific Grafana dashboard.
    - name: Fail with VMAgent rollout diagnostics
      fail:
        msg: >-
          VMAgent deployment did not become ready. Pod phases:
          {{ vmagent_pods.resources | default([]) | map(attribute='status.phase') | list }}.
          Check `kubectl describe deployment/vmagent-victoria-metrics-agent -n monitoring`
          and `kubectl logs -n monitoring -l app.kubernetes.io/instance=vmagent`.
      when: >
        vmagent_deploy.resources | default([]) | length == 0 or
        (vmagent_deploy.resources[0].status.readyReplicas | default(0)) !=
        (vmagent_deploy.resources[0].status.replicas | default(1))
      tags: [monitoring, vmagent]

    # ========================================================================
    # KUBE-STATE-METRICS - Kubernetes object metrics (node conditions etc.)
    # The vmagent scrape job for it has existed since initial deployment; this
    # supplies the actual exporter. Needed for the NodeNotReady alert.
    # ========================================================================
    - name: Install kube-state-metrics
      kubernetes.core.helm:
        name: kube-state-metrics
        chart_ref: prometheus-community/kube-state-metrics
        chart_version: "{{ kube_state_metrics_chart_version }}"
        release_namespace: monitoring
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        timeout: 300s
        values:
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      tags: [monitoring, vmalert, kube-state-metrics]

    # ========================================================================
    # VMALERT + ALERTMANAGER - Alert evaluation and ntfy push notifications
    # vmalert evaluates rules against vmsingle; Alertmanager routes to ntfy.sh
    # directly using ntfy message templating (no bridge component needed —
    # the URL query params below are URL-encoded Go templates rendered by
    # ntfy from Alertmanager's webhook JSON; tested end-to-end 2026-07-05).
    # Alertmanager is deliberately not persisted to Longhorn: the alerting
    # path must not depend on the storage it alerts about. Losing silences on
    # restart is an acceptable trade.
    # NOTE: if vmsingle itself is hard-down, vmalert evaluates nothing and no
    # alert fires — that gap is covered by the external dead-man's switch
    # (best-practices review, finding A3), not by rules here.
    # ========================================================================
    - name: Install VictoriaMetrics Alert (vmalert + Alertmanager)
      kubernetes.core.helm:
        name: vmalert
        chart_ref: vm/victoria-metrics-alert
        chart_version: "{{ vmalert_chart_version }}"
        release_namespace: monitoring
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        timeout: 300s
        values:
          server:
            resources:
              requests:
                cpu: 20m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
            datasource:
              url: http://vmsingle-victoria-metrics-single-server.monitoring.svc:8428
            notifier:
              url: http://vmalert-victoria-metrics-alert-alertmanager.monitoring.svc:9093
            config:
              alerts:
                groups:
                  - name: node-health
                    interval: 30s
                    rules:
                      - alert: NodeNotReady
                        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
                        for: 5m
                        labels:
                          severity: critical
                        annotations:
                          summary: !unsafe 'Node {{ $labels.node }} has been NotReady for 5 minutes'
                      - alert: NodeScrapeTargetDown
                        expr: up{job="node-exporter"} == 0
                        for: 5m
                        labels:
                          severity: critical
                        annotations:
                          summary: !unsafe 'node-exporter on {{ $labels.instance }} unreachable for 5m (node down or exporter broken)'
                      - alert: FilesystemDeviceError
                        expr: node_filesystem_device_error{mountpoint=~"/|/mnt/ssd|/var"} > 0
                        for: 2m
                        labels:
                          severity: critical
                        annotations:
                          summary: !unsafe 'Filesystem errors on {{ $labels.instance }} {{ $labels.mountpoint }} — SSD may have dropped off the bus (runbook: INCIDENT-2026-06-30)'
                  - name: storage
                    interval: 30s
                    rules:
                      - alert: LonghornVolumeDegraded
                        expr: longhorn_volume_robustness == 2
                        for: 10m
                        labels:
                          severity: warning
                        annotations:
                          summary: !unsafe 'Longhorn volume {{ $labels.volume }} is degraded (replica lost, rebuild not completing)'
                      - alert: LonghornVolumeFaulted
                        expr: longhorn_volume_robustness == 3
                        for: 1m
                        labels:
                          severity: critical
                        annotations:
                          summary: !unsafe 'Longhorn volume {{ $labels.volume }} is FAULTED — data unavailable'
                      - alert: PVCSpaceLow
                        expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.15
                        for: 15m
                        labels:
                          severity: warning
                        annotations:
                          summary: !unsafe 'PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} below 15% free'
                      - alert: PVCSpaceCritical
                        expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.05
                        for: 5m
                        labels:
                          severity: critical
                        annotations:
                          summary: !unsafe 'PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} below 5% free — imminent write failures'
                  - name: monitoring-pipeline
                    interval: 30s
                    rules:
                      - alert: VMSingleDown
                        expr: up{job="vmsingle"} == 0
                        for: 3m
                        labels:
                          severity: critical
                        annotations:
                          summary: 'VictoriaMetrics (vmsingle) scrape failing — metrics backend down or flapping'
                      - alert: VMAgentDown
                        expr: up{job="vmagent"} == 0
                        for: 5m
                        labels:
                          severity: warning
                        annotations:
                          summary: 'vmagent scrape failing — metric collection degraded'
                      - alert: VMAgentQueueHigh
                        expr: vmagent_remotewrite_pending_data_bytes > 268435456
                        for: 10m
                        labels:
                          severity: warning
                        annotations:
                          summary: !unsafe 'vmagent remote-write queue above 256MiB ({{ $value | humanize1024 }}B) — vmsingle slow or unreachable'
                      - alert: VMAgentQueueCritical
                        expr: vmagent_remotewrite_pending_data_bytes > 1073741824
                        for: 10m
                        labels:
                          severity: critical
                        annotations:
                          summary: !unsafe 'vmagent remote-write queue above 1GiB ({{ $value | humanize1024 }}B) — sustained ingestion failure'
                  - name: meta
                    interval: 30s
                    rules:
                      # Always-firing heartbeat for the alerting pipeline
                      # itself. Routed to healthchecks.io (NOT ntfy) — if
                      # vmsingle, vmalert, or Alertmanager breaks, the pings
                      # stop and healthchecks.io alerts from outside.
                      - alert: Watchdog
                        expr: vector(1)
                        labels:
                          severity: watchdog
                        annotations:
                          summary: 'Alerting pipeline heartbeat (expected to fire forever)'
                  - name: certificates
                    interval: 5m
                    rules:
                      - alert: APIClientCertExpirySoon
                        expr: >-
                          histogram_quantile(0.01,
                            sum by (le) (rate(apiserver_client_certificate_expiration_seconds_bucket[5m])))
                          < 30 * 86400
                        for: 1h
                        labels:
                          severity: warning
                        annotations:
                          summary: 'API server client certificates expiring within 30 days — check k3s cert rotation'
          alertmanager:
            enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
            config:
              global:
                resolve_timeout: 5m
              route:
                receiver: ntfy
                group_by: [alertname]
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 6h
                routes:
                  # Watchdog goes ONLY to healthchecks.io (first match wins).
                  # Ping cadence = group_interval ticks where repeat_interval
                  # has elapsed; repeat_interval MUST be strictly less than
                  # group_interval or drift doubles the effective cadence
                  # (observed 2026-07-05: 10m/10m produced ~20m pings and the
                  # check fell into grace). 5m/4m -> a ping every ~5m against
                  # the check's 15m period + 15m grace.
                  - receiver: healthchecks
                    matchers:
                      - alertname = "Watchdog"
                    group_wait: 15s
                    group_interval: 5m
                    repeat_interval: 4m
                  - receiver: ntfy
                    matchers:
                      - severity = "warning"
                    repeat_interval: 24h
              receivers:
                - name: healthchecks
                  webhook_configs:
                    - url: "{{ healthchecks_watchdog_url }}"
                      send_resolved: false
                - name: ntfy
                  webhook_configs:
                    # ntfy renders these URL-encoded Go templates against the
                    # Alertmanager webhook JSON. Decoded:
                    #   title:    {{if eq .status "firing"}}🔥{{else}}✅{{end}} {{.commonLabels.alertname}} [{{.commonLabels.severity}}]
                    #   message:  {{range .alerts}}{{.annotations.summary}}\n{{end}}
                    #   priority: urgent for critical, default otherwise
                    - url: "{{ ntfy_server }}/{{ ntfy_topic }}?tpl=yes&title=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D%F0%9F%94%A5%7B%7Belse%7D%7D%E2%9C%85%7B%7Bend%7D%7D%20%7B%7B.commonLabels.alertname%7D%7D%20%5B%7B%7B.commonLabels.severity%7D%7D%5D&message=%7B%7Brange%20.alerts%7D%7D%7B%7B.annotations.summary%7D%7D%0A%7B%7Bend%7D%7D&priority=%7B%7Bif%20eq%20.commonLabels.severity%20%22critical%22%7D%7Durgent%7B%7Belse%7D%7Ddefault%7B%7Bend%7D%7D"
                      send_resolved: true
      tags: [monitoring, vmalert]

    - name: Wait for vmalert and Alertmanager to be ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Pod
        namespace: monitoring
        label_selectors:
          - "app.kubernetes.io/instance=vmalert"
      register: vmalert_pods
      until: >
        vmalert_pods.resources | default([]) | length >= 2 and
        (vmalert_pods.resources | map(attribute='status.phase') | list | unique == ['Running'])
      retries: 30
      delay: 10
      tags: [monitoring, vmalert]

    # ========================================================================
    # DEAD-MAN'S SWITCH - external cluster heartbeat (healthchecks.io)
    # If the whole cluster (or just CronJob scheduling) dies, pings stop and
    # healthchecks.io alerts from OUTSIDE the cluster. Complements the
    # Watchdog alert above, which covers the alerting pipeline specifically.
    # Check config: period 5m, grace 5m -> alerted ~10m after cluster death.
    # ========================================================================
    - name: Deploy cluster heartbeat CronJob
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: cluster-heartbeat
            namespace: monitoring
          spec:
            schedule: "*/5 * * * *"
            concurrencyPolicy: Replace
            successfulJobsHistoryLimit: 1
            failedJobsHistoryLimit: 3
            jobTemplate:
              spec:
                activeDeadlineSeconds: 120
                backoffLimit: 2
                template:
                  spec:
                    restartPolicy: Never
                    containers:
                      - name: ping
                        # Image already cached on all nodes (Grafana init uses it)
                        image: docker.io/curlimages/curl:7.85.0
                        args:
                          - -fsS
                          - --max-time
                          - "10"
                          - --retry
                          - "3"
                          - "{{ healthchecks_heartbeat_url }}"
                        resources:
                          requests:
                            cpu: 10m
                            memory: 16Mi
                          limits:
                            cpu: 50m
                            memory: 32Mi
      tags: [monitoring, vmalert, heartbeat]

    # ========================================================================
    # FLUENT BIT - Log shipper DaemonSet
    # ========================================================================
    - name: Install Fluent Bit
      kubernetes.core.helm:
        name: fluent-bit
        chart_ref: fluent/fluent-bit
        chart_version: "{{ fluent_bit_chart_version }}"
        release_namespace: monitoring
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        timeout: 300s
        values:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          # Node identity for kernel log records (kmsg has no k8s metadata)
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # Reading /dev/kmsg requires privileged: CAP_SYSLOG alone is not
          # enough because the container's device cgroup blocks the char
          # device (verified: EPERM with SYSLOG cap + unconfined AppArmor,
          # works privileged). Same approach as node-problem-detector.
          securityContext:
            privileged: true
          # Kernel logs must be read from /dev/kmsg directly, NOT from journald:
          # persistent journal storage lives on /mnt/ssd/var, so journald dies
          # with the SSD — exactly when kernel logs matter most (2026-06-30
          # k3s-wrk-01 SSD disconnect left no local record of the USB event).
          extraVolumes:
            - name: kmsg
              hostPath:
                path: /dev/kmsg
                type: CharDevice
          extraVolumeMounts:
            - name: kmsg
              mountPath: /dev/kmsg
              readOnly: true
          config:
            # Tail all container logs written by containerd (CRI format)
            inputs: |
              [INPUT]
                  Name              tail
                  Path              /var/log/containers/*.log
                  multiline.parser  cri
                  Tag               kube.*
                  Mem_Buf_Limit     5MB
                  Skip_Long_Lines   On
                  Refresh_Interval  10

              [INPUT]
                  Name              kmsg
                  Tag               kernel.log
            # Enrich log lines with Kubernetes pod/namespace/container metadata
            filters: |
              [FILTER]
                  Name                kubernetes
                  Match               kube.*
                  Kube_URL            https://kubernetes.default.svc:443
                  Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
                  Kube_Tag_Prefix     kube.var.log.containers.
                  Merge_Log           On
                  K8S-Logging.Parser  On
                  K8S-Logging.Exclude Off

              # VictoriaLogs requires the message to be in the '_msg' field.
              # The Kubernetes filter stores the log line in 'log'; rename it
              # before shipping so Grafana's VictoriaLogs datasource can
              # display the message body correctly.
              [FILTER]
                  Name    modify
                  Match   kube.*
                  Rename  log _msg

              # Kernel records carry the message in 'msg' and no k8s metadata;
              # rename for VictoriaLogs and stamp the node name.
              [FILTER]
                  Name    modify
                  Match   kernel.*
                  Rename  msg _msg

              [FILTER]
                  Name    record_modifier
                  Match   kernel.*
                  Record  node ${NODE_NAME}
            # Ship logs to VictoriaLogs via its Loki-compatible ingest endpoint
            outputs: |
              [OUTPUT]
                  Name              loki
                  Match             kube.*
                  Host              vlogs-victoria-logs-single-server.monitoring.svc
                  Port              9428
                  URI               /insert/loki/api/v1/push
                  Labels            job=fluent-bit
                  auto_kubernetes_labels on
                  Tls               Off
                  Line_Format       json

              [OUTPUT]
                  Name              loki
                  Match             kernel.*
                  Host              vlogs-victoria-logs-single-server.monitoring.svc
                  Port              9428
                  URI               /insert/loki/api/v1/push
                  Labels            job=kernel-logs, node=${NODE_NAME}
                  Tls               Off
                  Line_Format       json
      tags: [monitoring, fluent-bit]

    # Fluent Bit readiness often fails first during node stalls because it is a
    # DaemonSet on every worker and its health endpoint is sensitive to brief
    # CPU starvation. Give it more time before kubelet restarts it.
    - name: Relax Fluent Bit probes for slow nodes
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: patched
        kind: DaemonSet
        namespace: monitoring
        name: fluent-bit
        definition:
          spec:
            template:
              spec:
                containers:
                  - name: fluent-bit
                    readinessProbe:
                      periodSeconds: 15
                      timeoutSeconds: 5
                      failureThreshold: 5
                    livenessProbe:
                      periodSeconds: 15
                      timeoutSeconds: 5
                      failureThreshold: 5
      tags: [monitoring, fluent-bit]

    # ========================================================================
    # GRAFANA - Dashboards
    # ========================================================================
    - name: Install Grafana
      kubernetes.core.helm:
        name: grafana
        chart_ref: grafana/grafana
        chart_version: "{{ grafana_version }}"
        release_namespace: monitoring
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        timeout: 300s
        values:
          # Single replica for RPi — avoids unnecessary resource use and
          # Multi-Attach PVC errors with ReadWriteOnce volumes.
          replicas: 1
          # Grafana is storage-backed and uses a single ReadWriteOnce PVC.
          # Prefer not to place it beside the other heavy PVC-backed monitoring
          # pods unless the scheduler has no better option.
          podLabels:
            pi-cluster.io/storage-heavy: "true"
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchExpressions:
                        - key: pi-cluster.io/storage-heavy
                          operator: In
                          values:
                            - "true"
                    topologyKey: kubernetes.io/hostname
          # Grafana uses a single Longhorn ReadWriteOnce PVC. Recreate avoids
          # rollout overlap where a new pod starts before the old pod releases
          # the volume, which otherwise triggers Multi-Attach errors.
          deploymentStrategy:
            type: Recreate
          adminPassword: "{{ grafana_admin_password }}"
          persistence:
            enabled: true
            storageClassName: "{{ storage_class }}"
            size: "{{ grafana_storage_size }}"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          # Grafana can take a few seconds to answer /api/health on this
          # cluster, especially after plugin load or while SQLite is busy.
          # The chart default readiness timeout (1s) is too aggressive and
          # causes the Service endpoint to flap, which Traefik surfaces as 502.
          readinessProbe:
            timeoutSeconds: 5
          # Startup probe prevents the liveness/readiness cycle from declaring
          # Grafana dead while plugins load or SQLite is still warming up on
          # slower storage.
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          # Third-party plugins to install on Grafana startup.
          # Requires outbound internet access from the monitoring namespace on
          # first install — the pod downloads plugins from grafana.com.
          plugins:
            - victoriametrics-logs-datasource
          # Configure for sub-path access
          grafana.ini:
            server:
              root_url: "{{ grafana_root_url }}"
              serve_from_sub_path: true
            auth.anonymous:
              enabled: false
          # Victoria Metrics as datasource
          datasources:
            datasources.yaml:
              apiVersion: 1
              datasources:
                - name: VictoriaMetrics
                  type: prometheus
                  url: http://vmsingle-victoria-metrics-single-server.monitoring.svc:8428
                  access: proxy
                  isDefault: true
                - name: VictoriaLogs
                  type: victoriametrics-logs-datasource
                  uid: victorialogs
                  url: http://vlogs-victoria-logs-single-server.monitoring.svc:9428
                  access: proxy
                  jsonData:
                    maxLines: 1000
          # Dashboard providers
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: default
                  orgId: 1
                  folder: ''
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/default
                - name: infrastructure
                  orgId: 1
                  folder: 'Infrastructure'
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/infrastructure
                - name: logs
                  orgId: 1
                  folder: 'Logs'
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/logs
          # Pre-provision community dashboards
          dashboards:
            default:
              # Node Exporter Full
              node-exporter-full:
                gnetId: 1860
                revision: 37
                datasource: VictoriaMetrics
              # Kubernetes Cluster Overview
              k8s-cluster:
                gnetId: 7249
                revision: 1
                datasource: VictoriaMetrics
            infrastructure:
              # Longhorn
              longhorn:
                gnetId: 16888
                revision: 9
                datasource: VictoriaMetrics
              # Traefik
              traefik:
                gnetId: 17346
                revision: 9
                datasource: VictoriaMetrics
              # Hubble
              hubble:
                gnetId: 16612
                revision: 1
                datasource: VictoriaMetrics
          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL
            datasources:
              enabled: true
      tags: [monitoring, grafana]

    # ========================================================================
    # TRAEFIK INGRESSROUTE FOR VICTORIALOGS WEB UI
    # ========================================================================
    # VictoriaLogs serves its web UI at /select/vmui/ on the backend service.
    # We expose it under /victorialogs using a StripPrefix middleware so that
    # requests reaching the pod have the correct paths.
    - name: Create VictoriaLogs StripPrefix middleware
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: vlogs-strip-prefix
            namespace: monitoring
          spec:
            stripPrefix:
              prefixes:
                - /victorialogs
      tags: [monitoring, victorialogs]

    - name: Create VictoriaLogs IngressRoute
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: victorialogs
            namespace: monitoring
          spec:
            entryPoints:
              - web
            routes:
              - match: PathPrefix(`/victorialogs`)
                kind: Rule
                middlewares:
                  - name: vlogs-strip-prefix
                services:
                  - name: vlogs-victoria-logs-single-server
                    port: 9428
      tags: [monitoring, victorialogs]

    # ========================================================================
    # TRAEFIK INGRESSROUTE FOR GRAFANA ACCESS
    # ========================================================================
    # Note: No StripPrefix middleware needed because Grafana is configured with
    # serve_from_sub_path = true and root_url = http://192.168.1.200/grafana
    - name: Create Grafana IngressRoute
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: grafana
            namespace: monitoring
          spec:
            entryPoints:
              - web
            routes:
              - match: PathPrefix(`/grafana`)
                kind: Rule
                services:
                  - name: grafana
                    port: 80
                    # Grafana's Service exposes port 80 -> targetPort 3000.
                    # Traefik occasionally fails to build pod backends for this
                    # translated Service and returns `404 Not Found` with
                    # `no servers found for monitoring/grafana` in its logs.
                    # NativeLB makes Traefik forward to the Service ClusterIP
                    # instead of resolving pod endpoints itself.
                    nativeLB: true
      tags: [monitoring, grafana]

    - name: Create custom Cilium dashboard ConfigMap
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        # Use a standalone manifest file here rather than embedding a large JSON
        # object in this playbook. It avoids YAML/templating edge cases and makes
        # future dashboard edits easier to review.
        src: "{{ playbook_dir }}/dashboards/cilium-overview-configmap.yaml"
      tags: [monitoring, grafana]

    - name: Create VictoriaLogs Kubernetes Logs dashboard ConfigMap
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ playbook_dir }}/dashboards/victorialogs-configmap.yaml"
      tags: [monitoring, grafana, victorialogs]

    # ========================================================================
    # VERIFICATION
    # ========================================================================
    # Note: Victoria Metrics Single uses a StatefulSet, not a Deployment
    - name: Wait for Victoria Metrics to be ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: StatefulSet
        namespace: monitoring
        name: vmsingle-victoria-metrics-single-server
      register: vm_sts
      until: >
        vm_sts.resources is defined and
        vm_sts.resources | length > 0 and
        (vm_sts.resources[0].status.readyReplicas | default(0)) ==
        (vm_sts.resources[0].status.replicas | default(1))
      retries: 30
      delay: 10
      ignore_errors: true
      tags: [monitoring, verification]

    - name: Query Victoria Metrics for expected scrape series
      kubernetes.core.k8s_exec:
        kubeconfig: "{{ kubeconfig }}"
        namespace: monitoring
        pod: "{{ vmagent_pod_name }}"
        command: >-
          sh -c "wget -qO- http://vmsingle-victoria-metrics-single-server.monitoring.svc:8428/api/v1/series?match[]={{ item }}"
      vars:
        vmagent_pod_name: "{{ vmagent_pods_ready.resources[0].metadata.name }}"
      register: monitoring_smoke_tests
      changed_when: false
      failed_when: false
      loop: "{{ monitoring_smoke_test_metric_names }}"
      when:
        - vmagent_pods_ready.resources | default([]) | length > 0
      tags: [monitoring, verification]

    - name: Report missing monitoring series
      ansible.builtin.debug:
        msg: >-
          Monitoring smoke test for {{ item.item }} returned no series yet.
          This can be normal immediately after deployment, but if it persists
          check vmagent targets and the exporter endpoint directly.
      loop: "{{ monitoring_smoke_tests.results | default([]) }}"
      when:
        - item.stdout is defined
        - item.stdout is search('"data":\\[\\]')
      tags: [monitoring, verification]

    - name: Get Fluent Bit pods for VictoriaLogs smoke test
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Pod
        namespace: monitoring
        label_selectors:
          - app.kubernetes.io/name=fluent-bit
      register: fluent_bit_pods
      changed_when: false
      tags: [monitoring, verification]

    # Query VictoriaLogs from the vmagent pod (which has wget) to confirm
    # that Fluent Bit has successfully shipped at least one log entry.
    - name: Query VictoriaLogs for recently ingested logs
      kubernetes.core.k8s_exec:
        kubeconfig: "{{ kubeconfig }}"
        namespace: monitoring
        pod: "{{ vmagent_pods_ready.resources[0].metadata.name }}"
        command: >-
          sh -c "wget -qO- 'http://vlogs-victoria-logs-single-server.monitoring.svc:9428/select/logsql/query?query=*&limit=1'"
      register: vlogs_smoke_test
      changed_when: false
      failed_when: false
      when:
        - vmagent_pods_ready.resources | default([]) | length > 0
      tags: [monitoring, verification]

    - name: Report VictoriaLogs ingest status
      ansible.builtin.debug:
        msg: >-
          VictoriaLogs smoke test: {{ 'logs ingested successfully' if
          (vlogs_smoke_test.stdout | default('')) | length > 10
          else 'no logs yet — Fluent Bit may still be starting up; check
          kubectl logs -n monitoring -l app.kubernetes.io/name=fluent-bit' }}
      when: vlogs_smoke_test is not skipped
      tags: [monitoring, verification]

    - name: Wait for Grafana to be ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Deployment
        namespace: monitoring
        name: grafana
      register: grafana_deploy
      until: >
        grafana_deploy.resources is defined and
        grafana_deploy.resources | length > 0 and
        (grafana_deploy.resources[0].status.readyReplicas | default(0)) ==
        (grafana_deploy.resources[0].status.replicas | default(1))
      retries: 30
      delay: 10
      ignore_errors: true

    - name: Display monitoring stack status
      ansible.builtin.debug:
        msg: |
          ============================================================
          VICTORIA METRICS MONITORING STACK DEPLOYED SUCCESSFULLY
          ============================================================

          Grafana:
            URL: http://192.168.1.200/grafana
            Username: admin
            Password: {{ grafana_admin_password }}
            Datasources: VictoriaMetrics (default) + VictoriaLogs

          Victoria Metrics (port-forward):
            kubectl port-forward -n monitoring svc/vmsingle-victoria-metrics-single-server 8428:8428
            Then access: http://localhost:8428

          VictoriaLogs Web UI:
