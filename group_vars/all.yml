---
# Shared cluster-wide configuration used by playbooks and documentation.

# Core cluster settings
k3s_version: v1.31.3+k3s1
master_ip: 192.168.1.41

# Network configuration
storage_network_range: 192.168.10.0/24
loadbalancer_ip_range: 192.168.1.200/31

# Add-on versions
cilium_version: "1.16.4"
longhorn_version: "1.7.2"
traefik_version: "30.1.0"
multus_version: "v4.1.3"
whereabouts_version: "v0.9.3"
longhorn_default_replica_count: 2
longhorn_node_down_pod_deletion_policy: "delete-both-statefulset-and-deployment-pod"
longhorn_control_plane_allow_scheduling: false
longhorn_node_tags:
  - storage-network
workload_node_label_key: "pi-cluster.io/workload-node"
workload_node_label_value: "true"

# Monitoring stack
victoria_metrics_version: "0.25.0"
vmalert_chart_version: "0.43.0"
kube_state_metrics_chart_version: "7.5.1"
# ntfy push notifications for alerts. The topic name acts as a shared secret
# on ntfy.sh (anyone who knows it can read/post), so it is stored with
# ansible-vault. Password file: ~/.ansible/vault-pass-pi-cluster (see
# ansible.cfg; keep a backup). To view/change:
#   ansible-vault decrypt/encrypt_string — or: ansible localhost -m debug -a var=ntfy_topic
# healthchecks.io dead-man's switch (best-practices review, finding A3).
# Two checks, created 2026-07-05 via API (key: ~/.ansible/healthchecks-api-key):
#   pi-cluster-heartbeat        — CronJob pings every 5m; silence = cluster down
#   pi-cluster-alerting-watchdog — Alertmanager Watchdog pings ~10m; silence =
#                                  alerting pipeline broken even if cluster is up
# Ping URLs are secrets (anyone with the URL can fake pings) — vaulted.
healthchecks_heartbeat_url: !vault |
