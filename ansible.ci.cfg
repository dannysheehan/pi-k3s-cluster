# CI-only Ansible config for ansible-lint / syntax-check on public runners.
# Omits vault_password_file and become_ask_pass so jobs do not need operator
# workstation secrets. Do not use this for real playbook runs.

[defaults]
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections
roles_path = ./roles:~/.ansible/roles:/usr/share/ansible/roles
inventory = ./hosts.ini
host_key_checking = False
timeout = 30

[privilege_escalation]
become = False
