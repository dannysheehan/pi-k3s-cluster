longhorn_default_replica_count: 2
longhorn_default_data_path: "/var/lib/longhorn"
longhorn_node_down_pod_deletion_policy: "delete-both-statefulset-and-deployment-pod"
longhorn_control_plane_allow_scheduling: true
longhorn_storage_nodes:
  - pi-ctl-03
  - pi-wrk-01
  - pi-wrk-02
longhorn_node_tags:
  - storage-network
workload_node_label_key: "pi-cluster.io/workload-node"
workload_node_label_value: "true"

# Raspberry Pi and USB SSD health collection. Leave the device blank to derive
# the parent disk backing /. These USB bridges expose health via SCSI mode.
pi_health_textfile_directory: /var/lib/node_exporter/textfile_collector
pi_health_smart_device: ""
pi_health_smart_device_type: scsi

# USB-SATA bridge stability for USB-root nodes. The fleet's 0930:1400 bridges
# advertise UAS and then drop off the bus (INCIDENT-2026-06-30). Ubuntu's
# tryboot layout reads /boot/firmware/current/cmdline.txt, not the leftover
# /boot/firmware/cmdline.txt. A reboot is required before the UAS quirk binds.
# Day-2: uv run ansible-playbook k3s-tune-usb-ssd.yml --limit pi-ctl-03
usb_ssd_bridge_vid_pid: "0930:1400"
usb_ssd_disable_uas: true
usb_ssd_disable_autosuspend: true
usb_ssd_mask_fstrim: true
usb_ssd_root_noatime: true
usb_ssd_reboot: false

# Secrets management. Set this non-secret identifier to the dedicated
# 1Password vault before running 05-secrets.yml. The service-account token is
# supplied through the playbook's private prompt and never stored here.
external_secrets_version: "2.9.0"
onepassword_vault_id: ""

# Flux bootstrap. The generated manifests remain canonical in home-gitops;
# these checksums make the initial controller/sync installation reproducible
# and force an explicit review when those bootstrap manifests change.
flux_version: "v2.9.3"
home_gitops_repository_url: >-
  http://nas.home.ftmon.org:3000/dsheehan/home-gitops.git
home_gitops_branch: main
home_gitops_cluster_path: ./clusters/rpi
home_gitops_flux_manifest_base_url: >-
  http://nas.home.ftmon.org:3000/dsheehan/home-gitops/raw/branch/main/clusters/rpi/flux-system
flux_components_manifest_checksum: >-
  sha256:c6e84495c3b611978d053adc40aca1e2a12af38f6e239c44a6b6c1224e01cab7
flux_sync_manifest_checksum: >-
  sha256:2dc61cf159f936756552ca2714656b6b757c2c618c1281bb4cfc10c16616e760

