apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-pi-health
  namespace: monitoring
data:
  pi-health.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 75},
                  {"color": "red", "value": 80}
                ]
              },
              "unit": "celsius"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {
            "legend": {"displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "expr": "pi_cpu_temperature_celsius",
              "legendFormat": "{{ instance }}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "SoC Temperature",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [
                {"options": {"0": {"color": "red", "text": "FAILED"}, "1": {"color": "green", "text": "Healthy"}}, "type": "value"}
              ],
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 6, "x": 12, "y": 0},
          "id": 2,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "textMode": "auto"},
          "targets": [
            {"expr": "pi_root_disk_smart_healthy", "instant": true, "legendFormat": "{{ instance }} {{ device }}", "refId": "A"}
          ],
          "title": "Root SSD SMART",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [
                {"options": {"0": {"color": "red", "text": "Collection failed"}, "1": {"color": "green", "text": "Collecting"}}, "type": "value"}
              ],
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 6, "x": 18, "y": 0},
          "id": 3,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "textMode": "auto"},
          "targets": [
            {"expr": "pi_health_metrics_scrape_success", "instant": true, "legendFormat": "{{ instance }}", "refId": "A"}
          ],
          "title": "Health Collection",
          "type": "stat"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 41,
      "tags": ["raspberry-pi", "hardware", "smart"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "browser",
      "title": "Raspberry Pi Health",
      "uid": "pi-health",
      "version": 1
    }
