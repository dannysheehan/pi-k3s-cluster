---
# Add exactly one server to the embedded-etcd cluster. The caller must use:
# ansible-playbook k3s-add-master.yml --limit <one-server> --forks=1

- name: Add one K3s server to the HA control plane
  hosts: masters
  gather_facts: false
  become: true
  serial: 1
  pre_tasks:
    - name: Require an explicit inventory limit
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
        fail_msg: >-
          Target exactly one server with --limit <node> and run with --forks=1.

    - name: Check API health on each other control-plane server
      ansible.builtin.command: kubectl get --raw=/healthz
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ item }}"
      loop: "{{ groups['masters'] | reject('equalto', inventory_hostname) | list }}"
      register: other_master_health
      changed_when: false
      failed_when: false

    - name: Choose a healthy existing control-plane server
      ansible.builtin.set_fact:
        healthy_delegate: >-
          {{ (other_master_health.results
              | selectattr('rc', 'equalto', 0)
              | map(attribute='item') | list | first) | default('') }}

    - name: Require a healthy existing control-plane server
      ansible.builtin.assert:
        that:
          - healthy_delegate | length > 0
        fail_msg: >-
          No healthy existing control-plane server is available to coordinate
          adding {{ inventory_hostname }}. Use 02-k3s-install.yml only for the
          initial empty-cluster bootstrap.

    - name: Check embedded etcd health before joining
      ansible.builtin.command: kubectl get --raw=/healthz/etcd
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ healthy_delegate }}"
      register: etcd_health
      changed_when: false

    - name: Read server join token
      ansible.builtin.command: cat /var/lib/rancher/k3s/server/node-token
      delegate_to: "{{ healthy_delegate }}"
      register: server_join_token
      changed_when: false
      no_log: true

  tasks:
    - name: Check whether a K3s server unit exists
      ansible.builtin.command: systemctl list-unit-files k3s.service
      register: k3s_server_unit
      changed_when: false
      failed_when: false

    - name: Download verified K3s installer
      ansible.builtin.get_url:
        url: "{{ k3s_install_script_url }}"
        dest: /usr/local/src/k3s-install.sh
        checksum: "{{ k3s_install_script_checksum }}"
        owner: root
        group: root
        mode: '0755'

    - name: Check K3s server state when installed
      ansible.builtin.command: systemctl is-active k3s
      register: k3s_server_state
      changed_when: false
      failed_when: false
      when: "'k3s.service' in k3s_server_unit.stdout"

    - name: Refuse automatic recovery of inactive K3s server state
      ansible.builtin.fail:
        msg: >-
          K3s is installed but inactive on {{ inventory_hostname }}. Do not
          delete server state automatically; investigate and use a reviewed
          recovery procedure.
      when:
        - "'k3s.service' in k3s_server_unit.stdout"
        - k3s_server_state.rc != 0

    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Create K3s configuration drop-in directory
      ansible.builtin.file:
        path: /etc/rancher/k3s/config.yaml.d
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Render shared K3s server configuration
      ansible.builtin.template:
        src: templates/k3s/server-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: '0600'

    - name: Render K3s server join configuration
      ansible.builtin.template:
        src: templates/k3s/server-join-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml.d/20-join.yaml
        owner: root
        group: root
        mode: '0600'
      vars:
        k3s_join_token: "{{ server_join_token.stdout }}"
      no_log: true

    - name: Install K3s server through the API VIP
      ansible.builtin.command: /usr/local/src/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: server
      when: "'k3s.service' not in k3s_server_unit.stdout"

    - name: Wait for K3s server service
      ansible.builtin.command: systemctl is-active k3s
      register: server_active
      until: server_active.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Configure crictl for the K3s runtime
      ansible.builtin.include_tasks: tasks/configure-crictl.yml

    - name: Install host CNI plugins required by the storage-network NAD
      ansible.builtin.include_tasks: tasks/install-storage-cni-plugins.yml

    - name: Wait for control-plane node registration
      ansible.builtin.command: >-
        kubectl get node {{ inventory_hostname }} -o
        jsonpath={.metadata.labels.node-role\\.kubernetes\\.io/control-plane}
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ healthy_delegate }}"
      register: joined_control_plane
      until: joined_control_plane.stdout == 'true'
      retries: 30
      delay: 10
      changed_when: false

    - name: Wait for embedded etcd health after join
      ansible.builtin.command: kubectl get --raw=/healthz/etcd
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ healthy_delegate }}"
      register: joined_etcd_health
      until: joined_etcd_health.rc == 0
      retries: 30
      delay: 10
      changed_when: false
