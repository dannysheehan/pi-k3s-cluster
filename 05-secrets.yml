---
# Install External Secrets Operator and connect it directly to a dedicated
# 1Password vault through the official 1Password SDK provider. The service
# account token is entered interactively and is never stored in this repo.

- name: Install External Secrets Operator with 1Password
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubeconfig: ~/.kube/config-rpi
  vars_prompt:
    - name: onepassword_service_account_token
      prompt: >-
        1Password service-account token (leave blank to retain the existing
        bootstrap Secret)
      private: true
      default: ""
  tasks:
    - name: Require a dedicated 1Password vault identifier
      ansible.builtin.assert:
        that:
          - onepassword_vault_id | default('') | length > 0
        fail_msg: >-
          Set onepassword_vault_id in group_vars/all.yml to the dedicated
          cluster vault identifier before deploying External Secrets.

    - name: Create External Secrets namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: external-secrets

    - name: Check for existing 1Password bootstrap Secret
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Secret
        namespace: external-secrets
        name: onepassword-service-account
      register: onepassword_bootstrap_secret
      no_log: true

    - name: Require an existing Secret or an interactive token
      ansible.builtin.assert:
        that:
          - >-
            onepassword_bootstrap_secret.resources | length == 1 or
            onepassword_service_account_token | length > 0
        fail_msg: >-
          No 1Password bootstrap Secret exists. Rerun and enter the dedicated
          service-account token at the private prompt.
      no_log: true

    - name: Validate supplied 1Password service-account token format
      ansible.builtin.assert:
        that:
          - onepassword_service_account_token is match('^ops_')
          - onepassword_service_account_token | length > 100
          - >-
            onepassword_service_account_token ==
            (onepassword_service_account_token | trim)
        fail_msg: >-
          The supplied value is not a 1Password service-account token. Use the
          long token beginning with ops_, not the vault ID or an account token.
      when: onepassword_service_account_token | length > 0
      no_log: true

    - name: Create or rotate 1Password bootstrap Secret when supplied
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: onepassword-service-account
            namespace: external-secrets
          type: Opaque
          stringData:
            token: "{{ onepassword_service_account_token }}"
      when: onepassword_service_account_token | length > 0
      no_log: true

    - name: Add External Secrets Helm repository
      kubernetes.core.helm_repository:
        name: external-secrets
        repo_url: https://charts.external-secrets.io
        force_update: true
      tags: [external-secrets, repositories]

    - name: Update External Secrets Helm repository index
      ansible.builtin.command: helm repo update external-secrets
      changed_when: false
      tags: [external-secrets, repositories]

    - name: Install External Secrets Operator
      kubernetes.core.helm:
        name: external-secrets
        chart_ref: external-secrets/external-secrets
        chart_version: "{{ external_secrets_version }}"
        release_namespace: external-secrets
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        timeout: 300s
        values:
          installCRDs: true
          replicaCount: 2
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          webhook:
            replicaCount: 2
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
          certController:
            replicaCount: 1
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
      tags: [external-secrets]

    - name: Configure cluster 1Password SecretStore
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ClusterSecretStore
          metadata:
            name: onepassword
          spec:
            provider:
              onepasswordSDK:
                vault: "{{ onepassword_vault_id }}"
                auth:
                  serviceAccountSecretRef:
                    name: onepassword-service-account
                    namespace: external-secrets
                    key: token
      tags: [external-secrets, onepassword]

    - name: Wait for 1Password ClusterSecretStore readiness
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: external-secrets.io/v1
        kind: ClusterSecretStore
        name: onepassword
      register: onepassword_store
      until: >-
        onepassword_store.resources | length == 1 and
        (onepassword_store.resources[0].status.conditions | default([])
        | selectattr('type', 'equalto', 'Ready')
        | selectattr('status', 'equalto', 'True') | list | length) == 1
      retries: 30
      delay: 10
      tags: [external-secrets, onepassword]
