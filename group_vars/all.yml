k3s_cluster_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16
k3s_cluster_domain: cluster.local
k3s_secrets_encryption: true
k3s_disabled_components:
  - servicelb
  - traefik
kube_vip_version: "v1.2.3"
kube_vip_image: >-
  ghcr.io/kube-vip/kube-vip:v1.2.3@sha256:2fcdbb014a2e217b9ea1b6dacac53d6851b185af323cdd28d100ad82d74bc79a

# Network configuration
storage_network_range: 192.168.10.0/24
loadbalancer_ip_range: 192.168.1.200/31

# Add-on versions
cilium_version: "1.20.0"
longhorn_version: "1.12.0"
traefik_version: "41.2.0"
gateway_api_version: "v1.6.1"
multus_version: "v4.3.0"
multus_manifest_checksum: >-
  sha256:2d622f697809644a12704497bbf5c3256adc1e7f5b5504655e4993743651b585
multus_image: >-
  ghcr.io/k8snetworkplumbingwg/multus-cni:v4.3.0@sha256:ec4e5dfe12b675e4dcbf4e9cd14892f7b4c8ac27aa0dc93cf2e9be0bdd7d764a
