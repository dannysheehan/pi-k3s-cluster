[project]
name = "pi-cluster"
version = "0.1.0"
description = "Python tooling for pi-cluster Ansible automation"
requires-python = ">=3.10"
dependencies = [
    "ansible-core>=2.16,<2.18",
    "kubernetes>=26.1",
    "netaddr>=0.8",
    "openshift>=0.13",
    "PyYAML>=6",
]

[dependency-groups]
dev = [
    "ansible-lint==26.8.0",
    "yamllint==1.38.0",
]
test = [
    "molecule==26.8.0",
    "molecule-plugins[docker]==26.7.15",
]
