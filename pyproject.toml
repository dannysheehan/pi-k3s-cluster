[project]
name = "pi-cluster"
version = "0.1.0"
description = "Python tooling for pi-cluster Ansible automation"
requires-python = ">=3.10"
dependencies = [
    "ansible-core>=2.16,<2.17",
    "kubernetes>=26.1",
    "netaddr>=0.8",
    "openshift>=0.13",
    "PyYAML>=6",
]

[dependency-groups]
dev = [
    "ansible-lint==25.12.2",
    "yamllint==1.37.1",
]
test = [
    "molecule==25.12.0",
    "molecule-plugins[docker]==23.7.0",
]
