---
# Remove exactly one K3s agent. The target must be a canonical inventory name,
# for example: ansible-playbook k3s-remove-worker.yml --limit pi-wrk-01
#
# By default this playbook removes the node from Kubernetes and stops/disables
# the agent, but preserves its local K3s state for a reviewed recovery or
# rejoin. Set -e wipe_data=true only when permanently decommissioning a node.

- name: Remove one K3s worker safely
  hosts: workers
  gather_facts: false
  become: true
  serial: 1
  vars:
    drain_timeout: 300
    force_drain: false
    skip_drain: false
    wipe_data: false
  pre_tasks:
    - name: Require one exact canonical inventory target
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_play_hosts_all | length == 1
          - ansible_limit == inventory_hostname
        fail_msg: >-
          Target exactly one worker by its canonical inventory name, for
          example --limit pi-wrk-01. Host patterns, groups, comma-separated
          limits, and substring-style targets are not allowed.

    - name: Check API health on control-plane servers
      ansible.builtin.command: kubectl get --raw=/healthz
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ item }}"
      loop: "{{ groups['masters'] }}"
      register: master_health
      changed_when: false
      failed_when: false

    - name: Choose a healthy control-plane server
      ansible.builtin.set_fact:
        healthy_delegate: >-
          {{ (master_health.results
              | selectattr('rc', 'equalto', 0)
              | map(attribute='item') | list | first) | default('') }}

    - name: Require a healthy control-plane server
      ansible.builtin.assert:
        that:
          - healthy_delegate | length > 0
        fail_msg: No healthy control-plane server can coordinate worker removal.

  tasks:
    - name: Check whether the exact worker node exists in Kubernetes
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - node
          - "{{ inventory_hostname }}"
          - --ignore-not-found
          - -o
          - name
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ healthy_delegate }}"
      register: kubernetes_node
      changed_when: false

    - name: Set exact Kubernetes node state
      ansible.builtin.set_fact:
        node_in_cluster: "{{ kubernetes_node.stdout == 'node/' ~ inventory_hostname }}"
        kubernetes_node_name: "{{ inventory_hostname }}"

    - name: Check whether the K3s agent service is installed
      ansible.builtin.command: systemctl list-unit-files k3s-agent.service
      register: agent_service_unit
      changed_when: false
      failed_when: false

    - name: Set K3s agent installation state
      ansible.builtin.set_fact:
        agent_installed: "{{ 'k3s-agent.service' in agent_service_unit.stdout }}"

    - name: Display worker removal plan
      ansible.builtin.debug:
        msg: >-
          Removing {{ inventory_hostname }}. Kubernetes node present:
          {{ node_in_cluster }}; agent installed: {{ agent_installed }};
          skip drain: {{ skip_drain }}; force drain: {{ force_drain }};
          wipe data: {{ wipe_data }}.

    - name: Cordon the worker before drain
      ansible.builtin.command: kubectl cordon {{ kubernetes_node_name }}
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ healthy_delegate }}"
      when:
        - node_in_cluster | bool
        - not (skip_drain | bool)
      changed_when: true

    - name: Drain worker workloads
      ansible.builtin.command:
        argv: "{{ ['kubectl', 'drain', kubernetes_node_name, '--ignore-daemonsets', '--delete-emptydir-data', '--timeout=' ~ (drain_timeout | string) ~ 's'] + (['--force'] if (force_drain | bool) else []) }}"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ healthy_delegate }}"
      when:
        - node_in_cluster | bool
        - not (skip_drain | bool)
      # A drain failure is intentionally fatal unless the operator explicitly
      # chose force_drain or skip_drain.
      changed_when: true

    - name: Stop and disable K3s agent while preserving its state by default
      ansible.builtin.systemd_service:
        name: k3s-agent
        state: stopped
        enabled: false
      when: agent_installed | bool

    - name: Delete the exact worker node from Kubernetes
      ansible.builtin.command: >-
        kubectl delete node {{ kubernetes_node_name }} --wait=true
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ healthy_delegate }}"
      when: node_in_cluster | bool
      changed_when: true

    - name: Check for the K3s agent uninstall script
      ansible.builtin.stat:
        path: /usr/local/bin/k3s-agent-uninstall.sh
      register: agent_uninstall_script
      when: wipe_data | bool

    - name: Run the K3s-provided agent uninstall script for a requested wipe
      ansible.builtin.command: /usr/local/bin/k3s-agent-uninstall.sh
      when:
        - wipe_data | bool
        - agent_uninstall_script.stat.exists

    - name: Remove only explicit K3s agent state and uninstall residue
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/rancher/k3s
        - /etc/rancher/k3s
        - /usr/local/bin/k3s
        - /usr/local/bin/k3s-killall.sh
        - /usr/local/bin/k3s-agent-uninstall.sh
        - /etc/systemd/system/k3s-agent.service
        - /etc/systemd/system/k3s-agent.service.env
      when: wipe_data | bool

    - name: Reload systemd after K3s agent wipe
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: wipe_data | bool

    - name: Report worker removal completion
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} has been removed from Kubernetes.
          {{ 'K3s agent state was explicitly wiped.' if (wipe_data | bool)
          else 'K3s agent state was preserved; the agent is stopped and disabled.' }}
