---
# Initial bootstrap only. It creates the first embedded-etcd server and joins
# agents through the API VIP. Add the remaining servers with k3s-add-master.yml
# one at a time; never rerun this playbook against a live cluster.

- name: Guard initial K3s bootstrap
  hosts: "{{ groups['masters'][0] }}"
  gather_facts: false
  become: true
  tasks:
    - name: Check whether K3s is already active
      ansible.builtin.command: systemctl is-active k3s
      register: k3s_running
      changed_when: false
      failed_when: false

    - name: Refuse to rerun bootstrap on an existing control plane
      ansible.builtin.fail:
        msg: >-
          K3s is already active on {{ inventory_hostname }}. Use the dedicated
          day-2 node playbooks; this bootstrap playbook must not be rerun.
      when: k3s_running.rc == 0

- name: Bootstrap first K3s server and API VIP
  hosts: "{{ groups['masters'][0] }}"
  gather_facts: false
  become: true
  tasks:
    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s/config.yaml.d
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Create K3s auto-deploy manifest directory
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/server/manifests
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Render common K3s server configuration
      ansible.builtin.template:
        src: templates/k3s/server-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: '0600'

    - name: Render bootstrap-only K3s configuration
      ansible.builtin.template:
        src: templates/k3s/bootstrap-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml.d/10-bootstrap.yaml
        owner: root
        group: root
        mode: '0600'

    - name: Render kube-vip RBAC manifest
      ansible.builtin.template:
        src: templates/k3s/kube-vip-rbac.yaml.j2
        dest: /var/lib/rancher/k3s/server/manifests/kube-vip-rbac.yaml
        owner: root
        group: root
        mode: '0600'

    - name: Render kube-vip control-plane DaemonSet manifest
      ansible.builtin.template:
        src: templates/k3s/kube-vip-daemonset.yaml.j2
        dest: /var/lib/rancher/k3s/server/manifests/kube-vip-daemonset.yaml
        owner: root
        group: root
        mode: '0600'

    - name: Check whether the K3s server unit exists
      ansible.builtin.command: systemctl list-unit-files k3s.service
      register: k3s_server_unit
      changed_when: false
      failed_when: false

    - name: Download verified K3s installer
      ansible.builtin.get_url:
        url: "{{ k3s_install_script_url }}"
        dest: /usr/local/src/k3s-install.sh
        checksum: "{{ k3s_install_script_checksum }}"
        owner: root
        group: root
        mode: '0755'

    - name: Install the first K3s server
      ansible.builtin.command: /usr/local/src/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: server
      when: "'k3s.service' not in k3s_server_unit.stdout"

    - name: Wait for the local K3s API
      ansible.builtin.command: kubectl get --raw=/healthz
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: local_api_health
      until: local_api_health.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Configure crictl for the K3s runtime
      ansible.builtin.include_tasks: tasks/configure-crictl.yml

    - name: Install host CNI plugins required by the storage-network NAD
      ansible.builtin.include_tasks: tasks/install-storage-cni-plugins.yml

    - name: Wait for kube-vip DaemonSet creation
      ansible.builtin.command: kubectl -n kube-system get daemonset kube-vip
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: kube_vip_daemonset
      until: kube_vip_daemonset.rc == 0
      retries: 30
      delay: 5
      changed_when: false

    - name: Wait for API VIP TCP reachability
      ansible.builtin.wait_for:
        host: "{{ api_vip }}"
        port: 6443
        timeout: 300
        connect_timeout: 5

    - name: Wait for API health through the VIP
      ansible.builtin.command: >-
        kubectl --server=https://{{ api_vip }}:6443 get --raw=/healthz
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: vip_api_health
      until: vip_api_health.rc == 0
      retries: 30
      delay: 5
      changed_when: false

    - name: Read bootstrap node token for agent joins
      ansible.builtin.command: cat /var/lib/rancher/k3s/server/node-token
      register: bootstrap_node_token
      changed_when: false
      no_log: true

- name: Join initial K3s agents through the API VIP
  hosts: workers
  gather_facts: false
  become: true
  tasks:
    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Render K3s agent configuration
      ansible.builtin.template:
        src: templates/k3s/agent-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: '0600'
      vars:
        k3s_join_token: "{{ hostvars[groups['masters'][0]].bootstrap_node_token.stdout }}"
      no_log: true

    - name: Check whether the K3s agent unit exists
      ansible.builtin.command: systemctl list-unit-files k3s-agent.service
      register: k3s_agent_unit
      changed_when: false
      failed_when: false

    - name: Download verified K3s installer
      ansible.builtin.get_url:
        url: "{{ k3s_install_script_url }}"
        dest: /usr/local/src/k3s-install.sh
        checksum: "{{ k3s_install_script_checksum }}"
        owner: root
        group: root
        mode: '0755'

    - name: Install K3s agent through the API VIP
      ansible.builtin.command: /usr/local/src/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: agent
      when: "'k3s-agent.service' not in k3s_agent_unit.stdout"

    - name: Wait for K3s agent service
      ansible.builtin.command: systemctl is-active k3s-agent
      register: agent_active
      until: agent_active.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Configure crictl for the K3s runtime
      ansible.builtin.include_tasks: tasks/configure-crictl.yml

    - name: Install host CNI plugins required by the storage-network NAD
      ansible.builtin.include_tasks: tasks/install-storage-cni-plugins.yml

    - name: Wait for agent node registration
      ansible.builtin.command: kubectl get node {{ inventory_hostname }}
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ groups['masters'][0] }}"
      register: agent_registered
      until: agent_registered.rc == 0
      retries: 30
      delay: 5
      changed_when: false
      # NotReady is expected here until Cilium is installed.

- name: Fetch VIP-based kubeconfig to control node
  hosts: "{{ groups['masters'][0] }}"
  gather_facts: false
  become: true
  tasks:
    - name: Copy kubeconfig to control node
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ~/.kube/config-rpi
        flat: true

    - name: Rewrite kubeconfig API endpoint to the VIP
      ansible.builtin.lineinfile:
        path: ~/.kube/config-rpi
        regexp: '^\s+server:\s+https://127\.0\.0\.1:6443'
        line: "    server: https://{{ api_vip }}:6443"
      delegate_to: localhost
      become: false
